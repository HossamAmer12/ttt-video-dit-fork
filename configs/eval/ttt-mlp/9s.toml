num_denoising_steps = 50
output_dir = "./output"
t5_model_dir = "/home/hossamamer/.cache/huggingface/hub/models--google--t5-v1_1-xxl/snapshots/3db67ab1af984cf10548a73467f0e5bca2aaaeb2"
vae_checkpoint_path = "/home/hossamamer/.cache/huggingface/hub/models--zai-org--CogVideoX-5b/snapshots/8fc5b281006c82b82d34fd2543d2f0ebb4e7e321/vae/"

[guider]
